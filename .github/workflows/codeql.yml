name: CodeQL

# Static analysis of the C# code. Findings appear under Security > Code scanning; they do not fail the build.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  analyze:
    name: Analyze (C#)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-and-quality

      - name: Build
        # CodeQL traces the compiler, so the build must not reuse a shared compiler server.
        run: >-
          dotnet build dotResult.slnx --configuration Release
          -p:RestoreLockedMode=true -p:UseSharedCompilation=false

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
