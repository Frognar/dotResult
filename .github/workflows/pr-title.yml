name: PR title

# Pull requests are squash-merged, so the PR title becomes the commit message that
# release-please reads. It must follow Conventional Commits: feat: ..., fix: ..., test: ...

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
