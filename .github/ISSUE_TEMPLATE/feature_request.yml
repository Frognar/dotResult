name: Feature request
description: Propose an addition to the API.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard to express with dotResult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Signatures and a usage example. Which laws should it satisfy?
      render: csharp
    validations:
      required: true
